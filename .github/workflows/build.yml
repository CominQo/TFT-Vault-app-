name: Build Windows exe

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]        # pushing a tag like v0.1.3 publishes a GitHub Release (this is what the in-app updater reads)

permissions:
  contents: write         # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build exe
        shell: bash
        run: |
          # Tag v0.1.3 -> version 0.1.3 baked into the app. Normal pushes build "dev" (updates are off in dev builds).
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="dev"; fi
          go mod tidy
          wails build -platform windows/amd64 -o TFT-Vault.exe -clean -s -ldflags "-X main.version=$VERSION"
          cd build/bin
          sha256sum TFT-Vault.exe > TFT-Vault.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tft-collection-exe
          path: |
            build/bin/TFT-Vault.exe
            build/bin/TFT-Vault.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/TFT-Vault.exe
            build/bin/TFT-Vault.exe.sha256
          generate_release_notes: true
