name: Build Windows exe
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
        
      - name: Build exe
        run: |
          go mod tidy
          wails build -platform windows/amd64 -o tft-vault.exe -clean -s
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tft-collection-exe
          path: build/bin/*.exe
